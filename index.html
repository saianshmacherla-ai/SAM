
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
    <div class="logo">🌱</div>
    <h1>AI Crop Recommendation System</h1>
    <button type="button" id="themeToggle">
    🌙 Dark Mode
</button>
    <p>Smart Farming • Better Decisions • Sustainable Agriculture</p>
</div>
        <p>Enter the soil and weather details to get a suitable crop recommendation.</p>
        <div class="weather-section">
    <h2>🌦️ Live Weather Information</h2>

    <label for="weatherCity">Enter City Name</label>
    <input
        type="text"
        id="weatherCity"
        placeholder="Example: Hyderabad"
    >

    <button type="button" id="getWeatherBtn">
        Get Weather
    </button>

    <div id="weatherResult"></div>
</div>

        <form id="cropForm">

            <label for="N">Nitrogen (N)</label>
            <input type="number" id="N" min="0" step="any" required>

            <label for="P">Phosphorus (P)</label>
            <input type="number" id="P" min="0" step="any" required>

            <label for="K">Potassium (K)</label>
            <input type="number" id="K" min="0" step="any" required>

            <label for="temperature">Temperature (°C)</label>
            <input type="number" id="temperature" step="any" required>

            <label for="humidity">Humidity (%)</label>
            <input type="number" id="humidity" min="0" max="100" step="any" required>

            <label for="ph">Soil pH</label>
            <input type="number" id="ph" min="0" max="14" step="any" required>

            <label for="rainfall">Rainfall (mm)</label>
            <input type="number" id="rainfall" min="0" step="any" required>

            <button type="submit">Recommend Crop</button>
            <button type="button" id="resetBtn">Reset</button>

        </form>

        <div id="result"></div>
        <div class="history-section">
    <h2>Prediction History</h2>

    <div id="history"></div>

    <button type="button" id="clearHistoryBtn">
        Clear History
    </button>
</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
